name: Scripts tests
on:
  push:
    paths:
      - 'skills/agentkey/**'
      - '.cursor-plugin/marketplace.json'
      - '.cursor-plugin/plugin.json'
      - 'plugins/agentkey/**'
      - 'gemini-extension.json'
      - 'plugin.json'
      - 'mcp_config.json'
      - 'tests/**'
      - 'scripts/sync-cursor-marketplace-plugin.sh'
      - '.github/workflows/scripts-test.yml'
  pull_request:
    paths:
      - 'skills/agentkey/**'
      - '.cursor-plugin/marketplace.json'
      - '.cursor-plugin/plugin.json'
      - 'plugins/agentkey/**'
      - 'gemini-extension.json'
      - 'plugin.json'
      - 'mcp_config.json'
      - 'tests/**'
      - 'scripts/sync-cursor-marketplace-plugin.sh'

jobs:
  bats:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated Cursor marketplace package
        run: |
          ./scripts/sync-cursor-marketplace-plugin.sh
          if ! git diff --quiet -- plugins/agentkey; then
            echo "::error::Cursor marketplace package is stale. Run ./scripts/sync-cursor-marketplace-plugin.sh and commit the generated plugins/agentkey changes."
            git diff -- plugins/agentkey
            exit 1
          fi
      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi
      - run: bats tests/
