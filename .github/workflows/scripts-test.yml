name: Scripts tests
on:
  push:
    paths:
      - 'skills/agentkey/scripts/**'
      - 'scripts/build-release-assets.sh'
      - 'skills/agentkey/SKILL.md'
      - 'skills/agentkey/references/setup.md'
      - 'gemini-extension.json'
      - 'plugin.json'
      - 'mcp_config.json'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'README.md'
      - 'docs/README_zh.md'
      - 'tests/**'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/scripts-test.yml'
  pull_request:
    paths:
      - 'skills/agentkey/scripts/**'
      - 'scripts/build-release-assets.sh'
      - 'skills/agentkey/SKILL.md'
      - 'skills/agentkey/references/setup.md'
      - 'gemini-extension.json'
      - 'plugin.json'
      - 'mcp_config.json'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'README.md'
      - 'docs/README_zh.md'
      - 'tests/**'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/scripts-test.yml'

jobs:
  bats:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi
      - run: bats tests/

  dsh-powershell-marker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve indented DSH block-scalar markers
        shell: pwsh
        run: ./tests/dsh-uninstall-marker.ps1
